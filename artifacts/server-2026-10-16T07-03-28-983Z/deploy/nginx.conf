# Set your real hostname and enable TLS with Certbot before going live.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
server {
  listen 80;
  server_name marketplace.example.com;
  client_max_body_size 10m;
  limit_req_status 429;

  location /api/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Only processed public catalogue media may be placed in this directory.
  location /media/ {
    alias /srv/mandisetu/uploads/public/;
    add_header X-Content-Type-Options nosniff;
    add_header Cross-Origin-Resource-Policy cross-origin;
    expires 1y;
    add_header Cache-Control "public, immutable";
    autoindex off;
  }
  # KYC and claim documents must only be served by the authorized API stream.
  location /uploads/ { deny all; }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}

# Separate frontend origins avoid asset-path collisions between Next.js apps.
server {
  listen 80;
  server_name seller.marketplace.example.com;
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
server {
  listen 80;
  server_name admin.marketplace.example.com;
  location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
