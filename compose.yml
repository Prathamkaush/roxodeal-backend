name: mandisetu
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mandisetu}
      POSTGRES_USER: ${POSTGRES_USER:-mandisetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [services]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker}
    # Write the password into a private config instead of a process argument.
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis.conf
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [services]

  migrate:
    image: ${BACKEND_IMAGE:-mandisetu-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mandisetu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mandisetu}
    command:
      [
        /app/node_modules/.bin/prisma,
        migrate,
        deploy,
        --schema=prisma/schema.prisma,
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [services]

  backend:
    image: ${BACKEND_IMAGE:-mandisetu-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mandisetu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mandisetu}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,https://mandisetu-users.vercel.app,https://mandisetu-sellers.vercel.app}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      PRIVATE_UPLOAD_DIR: /app/uploads/private
      PUBLIC_UPLOAD_DIR: /app/uploads/public
    ports:
      - 127.0.0.1:${BACKEND_PORT:-4000}:4000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [services]

volumes:
  postgres_data:
  redis_data:
  uploads_data:
networks:
  services:
